spring.application.name=springboot-book-generate-images

# Where projects, book text and generated images live. Relative to the working directory.
app.data-dir=data

# ---------------------------------------------------------------------------
# GEMINI SWITCH - the only line to change.
#   real  = call the Gemini API. Needs GEMINI_API_KEY.
#   simulate = no API key, no quota. Generated placeholder text and drawn PNGs,
#           with realistic delays so running / retry / concurrency are testable.
# ---------------------------------------------------------------------------
gemini.mode=simulate

# How long a simulated call takes. Ignored when gemini.mode=real.
# Raise these to make in-progress states easier to catch by hand.
gemini.simulate.text-delay=3s
gemini.simulate.image-delay=15s

gemini.api-key=